<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 672" width="1012" height="672" role="img" aria-labelledby="t">
<title id="t">Layers of a decision core: Domain at the center, then Features and Format, Runtime, Program and the facade; imports point inward</title>
<style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .name { font-size: 15px; font-weight: 600; }
    .note, .small { font-size: 12px; fill: #59636e; }
    .ring { stroke: #59636e; stroke-width: 1.5; }
    .planned { stroke-dasharray: 6 5; }
    .divider { stroke: #59636e; stroke-width: 1.5; }
    .arrow { stroke: #1f2328; stroke-width: 2; fill: none; }
    .arrowhead { fill: #1f2328; }
    .f0 { fill: #ddf4ff; }
    .f1 { fill: #dafbe1; }
    .f2 { fill: #fff8c5; }
    .f3 { fill: #ffeff7; }
    .f4 { fill: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .note, .small { fill: #9198a1; }
      .ring, .divider { stroke: #9198a1; }
      .arrow { stroke: #f0f6fc; }
      .arrowhead { fill: #f0f6fc; }
      .f0 { fill: #0d2a4a; }
      .f1 { fill: #12361f; }
      .f2 { fill: #3a3210; }
      .f3 { fill: #3b1d33; }
      .f4 { fill: #1e2530; }
    }
  </style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<circle class="ring f4" cx="336" cy="336" r="316"/>
<circle class="ring f3" cx="336" cy="336" r="266"/>
<circle class="ring f2" cx="336" cy="336" r="216"/>
<circle class="ring f1" cx="336" cy="336" r="166"/>
<circle class="ring f0" cx="336" cy="336" r="70"/>
<line class="divider" x1="336" y1="170" x2="336" y2="266"/><line class="divider" x1="336" y1="406" x2="336" y2="502"/>
<text x="336" y="328" text-anchor="middle"><tspan class="name" x="336">Domain</tspan><tspan class="note" x="336" dy="16">model, invariants</tspan></text>
<text x="218" y="328" text-anchor="middle"><tspan class="name" x="218">Format</tspan><tspan class="note" x="218" dy="16">translation</tspan></text>
<text x="454" y="328" text-anchor="middle"><tspan class="name" x="454">Features</tspan><tspan class="note" x="454" dy="16">decisions</tspan></text>
<text x="336" y="139" text-anchor="middle"><tspan class="name" x="336">Runtime</tspan><tspan class="note" x="336" dy="16">capabilities</tspan></text>
<text x="336" y="89" text-anchor="middle"><tspan class="name" x="336">Program</tspan><tspan class="note" x="336" dy="16">wiring</tspan></text>
<text x="336" y="39" text-anchor="middle"><tspan class="name" x="336">Facade</tspan><tspan class="note" x="336" dy="16">plain data, no logic</tspan></text>
<line class="arrow" x1="553.79" y1="553.79" x2="389.74" y2="389.74" marker-end="url(#head)"/>
<text class="name" x="712" y="40">Facade</text>
<text class="small" x="712" y="57">imports Domain, Features, Format, Program</text>
<text class="name" x="712" y="92">Program</text>
<text class="small" x="712" y="109">imports Domain, Features, Format, Runtime</text>
<text class="name" x="712" y="144">Runtime</text>
<text class="small" x="712" y="161">imports Domain</text>
<text class="name" x="712" y="196">Format</text>
<text class="small" x="712" y="213">imports Domain, Features</text>
<text class="name" x="712" y="248">Features</text>
<text class="small" x="712" y="265">imports Domain</text>
<text class="name" x="712" y="300">Domain</text>
<text class="small" x="712" y="317">imports nothing</text>
<text class="small" x="712" y="376">Every import points inward, and the rules</text>
<text class="small" x="712" y="393">are narrower than a strict onion: Runtime</text>
<text class="small" x="712" y="410">imports only Domain, Format imports only the</text>
<text class="small" x="712" y="427">value types of Features, and the facade does</text>
<text class="small" x="712" y="444">not import Runtime. The app shell sits</text>
<text class="small" x="712" y="461">outside the facade and calls only the</text>
<text class="small" x="712" y="478">facade.</text>
</svg>
