name: check-purescript-gotchas

on:
  push:
    paths:
      - "skills/purescript-gotchas/**"
      - "checks/purescript-gotchas/**"
      - "anchors.json"
      - ".github/workflows/check-purescript-gotchas.yml"
  pull_request:
    paths:
      - "skills/purescript-gotchas/**"
      - "checks/purescript-gotchas/**"
      - "anchors.json"
      - ".github/workflows/check-purescript-gotchas.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          no-cache: true
      - name: Runner tests
        run: python3 -m unittest discover -s checks/purescript-gotchas -p 'test_*.py' -v
      - name: PureScript gotchas check
        run: checks/purescript-gotchas/run.sh
      - name: Anchors gate
        run: python3 scripts/anchors_gate.py
