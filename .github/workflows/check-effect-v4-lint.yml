name: check-effect-v4-lint

on:
  push:
    paths:
      - "skills/effect-v4/lint/**"
      - "checks/effect-v4-lint/**"
      - "anchors.json"
      - ".github/workflows/check-effect-v4-lint.yml"
  pull_request:
    paths:
      - "skills/effect-v4/lint/**"
      - "checks/effect-v4-lint/**"
      - "anchors.json"
      - ".github/workflows/check-effect-v4-lint.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          no-cache: true
      - name: Effect v4 lint check
        run: checks/effect-v4-lint/run.sh --verbose
      - name: Effect v4 lint check tests
        run: checks/effect-v4-lint/test-run.sh
