name: check-decision-core-diagram

on:
  push:
    paths:
      - "skills/decision-core-architecture/diagram/**"
      - "checks/decision-core-diagram/**"
      - ".github/workflows/check-decision-core-diagram.yml"
  pull_request:
    paths:
      - "skills/decision-core-architecture/diagram/**"
      - "checks/decision-core-diagram/**"
      - ".github/workflows/check-decision-core-diagram.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          no-cache: true
      - name: Onion diagram check
        run: checks/decision-core-diagram/run.sh
      - name: Onion diagram check tests
        run: checks/decision-core-diagram/test-run.sh
