name: check-readable-functional-code-tsdoc

on:
  push:
    paths:
      - "skills/readable-functional-code/tsdoc/**"
      - "checks/readable-functional-code-tsdoc/**"
      - "anchors.json"
      - ".github/workflows/check-readable-functional-code-tsdoc.yml"
  pull_request:
    paths:
      - "skills/readable-functional-code/tsdoc/**"
      - "checks/readable-functional-code-tsdoc/**"
      - "anchors.json"
      - ".github/workflows/check-readable-functional-code-tsdoc.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          no-cache: true
      - name: TSDoc gate check
        run: checks/readable-functional-code-tsdoc/run.sh
      - name: TSDoc gate check tests
        run: checks/readable-functional-code-tsdoc/test-run.sh
